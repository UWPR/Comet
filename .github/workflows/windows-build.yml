name: Build on Windows with self-hosted

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Mark git working directory as safe
      shell: cmd
      run: |
        git config --global --add safe.directory "C:/actions-runner-UWPR/_work/Comet/Comet"

    - name: Unpack Thermo MSFileReader (7-Zip)
      shell: cmd
      run: |
        "C:\Program Files\7-Zip\7z.exe" x -piacceptthelicense extern\msfreader.zip -odlls -y

    - name: Register Thermo MSFileReader
      shell: cmd
      run: |
        FOR %%G IN (dlls\*.dll) DO regsvr32 /S %%G

    - name: Setup msbuild
      uses: microsoft/setup-msbuild@v1.1
      with:
        # The self-hosted runner (WIN64-UWPR) also has Visual Studio 2026 installed. Its
        # MSBuild evaluates CometWrapperCore with the VS 2026 .NET SDK, which insists on
        # net8.0 targeting packs at a patch version that is not installed (NETSDK1145),
        # even with the v143 override below. Stay on the VS 2022 instance until the
        # projects move to VS 2026 (branch VS2026).
        vs-version: '[17.0,18.0)'

    - name: Write commit hash to header file
      shell: cmd
      run: |
        echo #define GITHUBSHA "%GITHUB_SHA%" > CometSearch/githubsha.h
        dir CometSearch
        type CometSearch\\githubsha.h

    - name: Restore NuGet packages
      run: |
        msbuild Comet.sln -t:Restore -p:Configuration=Release -p:Platform=x64 -p:RestoreConfigFile=nuget.config

    - name: Build Comet
      run: |
        msbuild Comet.sln -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -tv:Current

    - name: Test Comet
      shell: cmd
      run: "%GITHUB_WORKSPACE%\\x64\\Release\\Comet.exe -p"

    # tests/unit/MiniTest.h-based C++ unit tests (CometUnitTests project in Comet.sln)
    - name: Run C++ unit tests
      shell: cmd
      run: "%GITHUB_WORKSPACE%\\x64\\Release\\CometUnitTests.exe"

    # The runner service's PATH is not the machine PATH ("python" resolved to a pre-3.10
    # interpreter, "py" was not found, and the machine's Python 3.14 is a per-user install with
    # no HKLM registration), so the workflow provisions its own interpreter into the runner's
    # tool cache instead of relying on whatever the service account can see.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Python test harness (tests/unit/run_tests.py): builds the small fixture indexes and
    # searches them; ~4 minutes. --integration (human.small.fasta, big data) is not run in CI.
    - name: Run test harness
      shell: cmd
      run: |
        python --version
        python "%GITHUB_WORKSPACE%\\tests\\unit\\run_tests.py" --comet "%GITHUB_WORKSPACE%\\x64\\Release\\Comet.exe"

    - name: Prepare release directory (Windows native)
      shell: cmd
      run: |
        if not exist release mkdir release
        copy x64\Release\comet.exe release\comet.win64.exe
        copy x64\Release\CometWrapper.dll release\
        copy x64\Release\ThermoFisher.CommonCore.Data.dll release\
        copy x64\Release\ThermoFisher.CommonCore.RawFileReader.dll release\
        copy README.md release\README.md

    - name: Upload build artificats
      uses: actions/upload-artifact@v4
      with:
        name: comet-windows
        path: release/*

    - name: Upload binary to the release
      uses: svenstaro/upload-release-action@v2
      if: ${{ github.event_name == 'release' }}
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        # README.md is deliberately excluded here and uploaded once, by
        # linux-build.yml, to avoid all five platform jobs racing to
        # create/overwrite the same-named release asset concurrently.
        file: release/comet.win64.exe
        overwrite: true

    - name: Upload DLLs to the release
      uses: svenstaro/upload-release-action@v2
      if: ${{ github.event_name == 'release' }}
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        file: release/*.dll
        overwrite: true
        file_glob: true
